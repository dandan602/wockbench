<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>个人工作台 v2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#eef2fa;--card:#fff;--text:#1f2937;--muted:#8a93a5;
 --primary:#4f6ef7;--primary-soft:#eef1fe;
 --green:#10b981;--green-soft:#e7f8f2;
 --orange:#f59e0b;--orange-soft:#fff4e2;
 --red:#ef4444;--red-soft:#fdecec;
 --purple:#8b5cf6;--purple-soft:#f2ecfe;
 --border:#e9edf6;--radius:14px;
 --shadow:0 2px 14px rgba(31,41,55,.06);
 --shadow-lg:0 8px 30px rgba(31,41,55,.1);
 --body-bg:linear-gradient(160deg,#e9effb 0%,#f6f9fd 45%,#eaf5f3 100%);
 --input-bg:#fbfcfe;
 --hover-bg:#f5f7fd;
 --code-bg:#f4f6fb;
}
[data-theme="dark"]{
 --bg:#13161f;--card:#1c2030;--text:#e2e6ef;--muted:#6b7490;
 --primary:#6b8aff;--primary-soft:#252b45;
 --green:#34d399;--green-soft:#1a2e28;
 --orange:#fbbf24;--orange-soft:#2e2718;
 --red:#f87171;--red-soft:#2e1a1a;
 --purple:#a78bfa;--purple-soft:#251e3a;
 --border:#2a2f42;--shadow:0 2px 14px rgba(0,0,0,.25);
 --shadow-lg:0 8px 30px rgba(0,0,0,.35);
 --body-bg:linear-gradient(160deg,#10131c 0%,#161a28 45%,#121820 100%);
 --input-bg:#222638;--hover-bg:#252a3e;--code-bg:#222638;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 background:var(--body-bg);color:var(--text);font-size:14px;min-height:100vh;
 -webkit-font-smoothing:antialiased;transition:background .35s,color .35s;
}
.app{display:flex;flex-direction:column;gap:14px;padding:16px;min-height:100vh}

/* ---------- 顶部栏 ---------- */
.topbar{
 display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;
 background:var(--card);border-radius:var(--radius);padding:14px 22px;
 box-shadow:var(--shadow);transition:background .35s,box-shadow .35s;
}
.clock-area{display:flex;align-items:center;gap:14px}
.clock-time{font-size:26px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock-date{font-size:12px;color:var(--muted);margin-top:2px}

/* 环形进度 */
.ring-wrap{position:relative;width:52px;height:52px;flex:0 0 52px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:var(--border);transition:stroke .35s}
.ring-fg{stroke:var(--green);transition:stroke-dashoffset .6s ease,stroke .35s}
.ring-text{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:700;color:var(--green);
}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{
 display:flex;flex-direction:column;align-items:center;gap:2px;
 padding:8px 6px;border-radius:10px;background:var(--code-bg);transition:.2s;cursor:default;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .num{font-size:20px;font-weight:700;line-height:1.1}
.stat .lab{font-size:11px;color:var(--muted)}
.stat.s-total .num{color:var(--primary)}
.stat.s-doing .num{color:var(--orange)}
.stat.s-done .num{color:var(--green)}
.stat.s-over .num{color:var(--red)}
.stat.s-soon .num{color:var(--purple)}

.topbar-right{display:flex;align-items:center;gap:14px}
.quote{
 max-width:230px;text-align:right;font-size:12.5px;color:#5b6478;line-height:1.6;
 border-left:3px solid var(--primary-soft);padding-left:12px;transition:border-color .35s;
}
[data-theme="dark"] .quote{color:#8b93a8}
.quote b{display:block;color:var(--primary);font-size:11px;margin-bottom:3px;font-weight:600}

/* 主题切换 */
.theme-toggle{
 width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
 background:var(--code-bg);cursor:pointer;font-size:18px;display:flex;
 align-items:center;justify-content:center;transition:.2s;flex:0 0 40px;
}
.theme-toggle:hover{background:var(--hover-bg);transform:scale(1.05)}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:196px 1fr;gap:14px;align-items:start;flex:1}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- 侧边栏 ---------- */
.sidebar{
 background:var(--card);border-radius:var(--radius);padding:12px;
 display:flex;flex-direction:column;gap:4px;
 box-shadow:var(--shadow);position:sticky;top:16px;transition:background .35s;
}
.side-title{font-size:11px;color:var(--muted);padding:6px 10px 4px;letter-spacing:.5px}
.nav-item{
 display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
 padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--text);
 text-align:left;transition:.15s;font-family:inherit;
}
.nav-item:hover{background:var(--hover-bg)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .badge{
 margin-left:auto;font-size:11px;background:var(--code-bg);color:var(--muted);
 padding:1px 7px;border-radius:20px;transition:background .35s,color .35s;
}
.nav-item.active .badge{background:var(--primary);color:#fff}
.nav-divider{height:1px;background:var(--border);margin:6px 0;transition:background .35s}

/* 快捷键提示 */
.shortcut-hint{
 font-size:10px;color:var(--muted);background:var(--code-bg);
 padding:1px 5px;border-radius:4px;margin-left:auto;font-family:monospace;
}

/* ---------- 卡片 ---------- */
.card{
 background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;
 box-shadow:var(--shadow);overflow:hidden;transition:background .35s,box-shadow .35s;
 animation:cardIn .4s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-head{
 display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);
 flex:0 0 auto;transition:border-color .35s;
}
.card-head h3{font-size:14px;font-weight:600;flex:1}
.pill{font-size:11px;color:var(--muted);background:var(--code-bg);padding:2px 9px;border-radius:20px;transition:background .35s}
.card-body{flex:1;overflow:auto;padding:14px 16px}
.card-body::-webkit-scrollbar{width:6px}
.card-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.card-body::-webkit-scrollbar-track{background:transparent}

.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ---------- 日清卡片样式 ---------- */
#riqingContent{overflow-y:auto;max-height:260px}
#riqingContent pre{margin:0;font-family:inherit;white-space:pre-wrap;line-height:1.7;font-size:13px}
#riqingEdit{width:100%;height:100%;resize:none;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;line-height:1.7;outline:none;background:var(--input-bg);color:var(--text)}
#riqingEdit:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px var(--primary-soft)}.row4{display:grid;grid-template-columns:0.9fr 1fr 1.3fr 1fr;gap:14px}
.row3 .card,.row4 .card{height:296px}
.row3 .card:nth-child(1){animation-delay:.05s}
.row3 .card:nth-child(2){animation-delay:.1s}
.row3 .card:nth-child(3){animation-delay:.15s}
.row4 .card:nth-child(1){animation-delay:.05s}
.row4 .card:nth-child(2){animation-delay:.1s}
.row4 .card:nth-child(3){animation-delay:.15s}
.row4 .card:nth-child(4){animation-delay:.2s}
.row2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.row2 .card{height:430px}
.row2 .card:nth-child(1){animation-delay:.2s}
.row2 .card:nth-child(2){animation-delay:.25s}

/* ---------- 搜索栏 ---------- */
.search-bar{
 display:flex;align-items:center;gap:8px;padding:8px 12px;
 background:var(--input-bg);border:1px solid var(--border);border-radius:10px;
 transition:.2s;margin-bottom:2px;
}
.search-bar:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search-bar input{
 flex:1;border:0;background:transparent;outline:none;font-size:13px;
 color:var(--text);font-family:inherit;
}
.search-bar input::placeholder{color:var(--muted)}
.search-bar .search-icon{color:var(--muted);font-size:14px;flex:0 0 14px}
.search-bar .clear-search{
 border:0;background:transparent;color:var(--muted);cursor:pointer;
 font-size:16px;padding:0 2px;display:none;
}
.search-bar .clear-search.show{display:block}
.search-bar .clear-search:hover{color:var(--text)}

/* ---------- 今日待办 ---------- */
.today-item{
 display:flex;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;
 transition:.15s;align-items:flex-start;
}
.today-item:hover{background:var(--hover-bg)}
.today-item .tt{flex:1;min-width:0}
.today-item .tt b{display:block;font-size:13px;font-weight:500;line-height:1.45;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item .tm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px}
.today-item.overdue .tm{color:var(--red)}

/* 行内状态切换 */
.inline-toggle{
 width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
 background:transparent;cursor:pointer;flex:0 0 20px;display:flex;
 align-items:center;justify-content:center;transition:.2s;font-size:10px;color:transparent;
}
.inline-toggle:hover{border-color:var(--green);background:var(--green-soft)}
.inline-toggle.done{border-color:var(--green);background:var(--green);color:#fff}
.inline-toggle.doing{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}

/* ---------- 周度复盘 ---------- */
#reviewInput{
 width:100%;height:150px;resize:none;border:1px solid var(--border);border-radius:10px;
 padding:10px;font-family:inherit;font-size:13px;line-height:1.7;outline:none;
 transition:.2s;background:var(--input-bg);color:var(--text);
}
#reviewInput:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px var(--primary-soft)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{
 border:0;border-radius:9px;padding:8px 14px;font-size:12.5px;cursor:pointer;
 font-family:inherit;transition:.15s;font-weight:500;
}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:var(--code-bg);color:var(--text)}
.btn.ghost:hover{background:var(--hover-bg)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.danger:hover{filter:brightness(.95)}
.btn.small{padding:5px 11px;font-size:12px}
.btn.icon{padding:3px 10px;font-size:16px;background:var(--code-bg);color:var(--muted);line-height:1.2}
.btn.icon:hover{color:var(--text);background:var(--hover-bg)}

/* ---------- 月度统计 ---------- */
.m-top{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.m-top b{font-size:30px;font-weight:700;color:var(--green);line-height:1}
.m-top span{font-size:12px;color:var(--muted)}
.m-row{margin-bottom:11px}
.m-row .mr-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--text)}
.bar{height:7px;background:var(--code-bg);border-radius:6px;overflow:hidden;transition:background .35s}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s ease}
.bar i.c-monthly{background:var(--primary)}
.bar i.c-urgent{background:var(--red)}
.bar i.c-daily{background:var(--green)}
.m-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:22px 0}

/* ---------- 任务列表 ---------- */
.task-item{
 display:flex;flex-direction:column;gap:6px;padding:11px 12px;border-radius:11px;
 cursor:pointer;transition:.15s;border:1px solid transparent;
}
.task-item:hover{background:var(--hover-bg);border-color:var(--border)}
.ti-top{display:flex;align-items:center;gap:8px}
.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sdot.todo{background:#b6bfd0}
.sdot.doing{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.sdot.done{background:var(--green)}
.ti-title{flex:1;font-size:13.5px;font-weight:500;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.ti-title.finished{text-decoration:line-through;color:var(--muted)}

/* 优先级标签 */
.prio{font-size:10px;padding:2px 6px;border-radius:4px;flex:0 0 auto;font-weight:600;letter-spacing:.3px}
.prio.high{background:var(--red-soft);color:var(--red)}
.prio.normal{background:var(--code-bg);color:var(--muted)}
.prio.low{background:var(--green-soft);color:var(--green)}

.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;flex:0 0 auto;font-weight:500}
.tag.c-monthly{background:var(--primary-soft);color:var(--primary)}
.tag.c-urgent{background:var(--red-soft);color:var(--red)}
.tag.c-daily{background:var(--green-soft);color:var(--green)}
.ti-meta{display:flex;gap:14px;font-size:11.5px;color:var(--muted);padding-left:16px}
.ti-meta .danger{color:var(--red);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:34px 0}

/* ---------- 日历 ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
 font-size:11px;color:var(--muted);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{
 aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:3px;cursor:pointer;transition:.15s;position:relative;
}
.cal-cell:hover{background:var(--hover-bg)}
.cal-cell.out{color:var(--border);cursor:default}
.cal-cell.out:hover{background:transparent}
.cal-cell.wk .cal-num{color:var(--muted)}
.cal-cell.today{background:var(--primary-soft)}
.cal-cell.today .cal-num{color:var(--primary);font-weight:700}
.cal-cell.sel{background:var(--primary)}
.cal-cell.sel .cal-num{color:#fff}
.cal-num{font-size:12.5px;line-height:1}
.cal-dots{display:flex;gap:2.5px;height:5px;align-items:center}
.cal-dots i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.cal-dots i.monthly{background:var(--primary)}
.cal-dots i.urgent{background:var(--red)}
.cal-dots i.daily{background:var(--green)}
.cal-dots em{font-size:9px;color:var(--muted);font-style:normal;line-height:1}

/* ---------- 弹窗 ---------- */
.mask{
 position:fixed;inset:0;background:rgba(23,31,48,.42);display:none;
 align-items:center;justify-content:center;padding:20px;z-index:100;
 backdrop-filter:blur(3px);
}
[data-theme="dark"] .mask{background:rgba(0,0,0,.6)}
.mask.show{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
 background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:90vh;
 display:flex;flex-direction:column;overflow:hidden;
 box-shadow:var(--shadow-lg);animation:pop .2s ease;transition:background .35s;
}
.modal.wide{max-width:680px}
@keyframes pop{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);transition:border-color .35s}
.modal-head h3{font-size:15px;flex:1}
.x{border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;
 line-height:1;padding:0 4px;transition:color .15s}
.x:hover{color:var(--text)}
.modal-body{padding:18px 20px;overflow:auto;flex:1}
.modal-foot{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--border);background:var(--input-bg);transition:background .35s,border-color .35s}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{
 width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
 font-family:inherit;font-size:13px;outline:none;transition:.18s;
 background:var(--input-bg);color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--primary);background:var(--card);box-shadow:0 0 0 3px var(--primary-soft)
}
.field textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.attach-box{border:1px dashed var(--border);border-radius:10px;padding:10px;background:var(--input-bg);transition:border-color .35s,background .35s}
.attach{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 8px;
 background:var(--card);border-radius:7px;margin-bottom:5px;border:1px solid var(--border);transition:background .35s,border-color .35s}
.attach span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach .rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.attach .rm:hover{color:var(--red)}
.upload-btn{
 display:inline-block;font-size:12px;color:var(--primary);cursor:pointer;
 padding:4px 10px;border-radius:7px;background:var(--primary-soft);margin-top:4px;
 transition:.15s;
}
.upload-btn:hover{filter:brightness(.95)}
.empty-mini{font-size:12px;color:var(--muted);padding:3px 2px 6px}
pre#reportText{
 white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",Consolas,Menlo,monospace;
 font-size:12.5px;line-height:1.85;color:var(--text);
}

/* ---------- 庆祝动画 ---------- */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti{
 position:absolute;width:8px;height:8px;border-radius:2px;
 animation:confettiFall 1.2s ease-out forwards;
}
@keyframes confettiFall{
 0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}
 100%{transform:translateY(100vh) rotate(720deg) scale(0);opacity:0}
}

/* ---------- 快捷键提示浮层 ---------- */
.shortcut-panel{
 position:fixed;bottom:20px;right:20px;background:var(--card);border-radius:12px;
 padding:14px 18px;box-shadow:var(--shadow-lg);z-index:50;
 font-size:12px;display:none;min-width:200px;transition:background .35s;
}
.shortcut-panel.show{display:block;animation:pop .2s ease}
.shortcut-panel h4{font-size:13px;margin-bottom:8px;color:var(--text)}
.shortcut-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.shortcut-row kbd{
 background:var(--code-bg);padding:1px 6px;border-radius:4px;
 font-family:monospace;font-size:11px;color:var(--text);border:1px solid var(--border);
}

/* ---------- Toast ---------- */
.toast{
 position:fixed;top:20px;left:50%;transform:translateX(-50%);
 background:var(--card);color:var(--text);padding:10px 20px;border-radius:10px;
 box-shadow:var(--shadow-lg);font-size:13px;z-index:200;
 opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 响应式 ---------- */
@media(max-width:1100px){
 .row3,.row4{grid-template-columns:1fr}
 .row3 .card{height:auto;min-height:230px}
 .row2{grid-template-columns:1fr}
 .row2 .card{height:auto;min-height:330px}
}
@media(max-width:820px){
 .topbar{grid-template-columns:1fr;gap:14px}
 .topbar-right{flex-direction:row-reverse}
 .quote{text-align:left;max-width:none}
 .stats{grid-template-columns:repeat(5,1fr)}
 .layout{grid-template-columns:1fr}
 .sidebar{position:static;flex-direction:row;overflow-x:auto}
 .side-title{display:none}
 .nav-item{white-space:nowrap;width:auto}
 .shortcut-hint{display:none}
 .grid2,.grid3{grid-template-columns:1fr}
 .ring-wrap{display:none}
}
</style>
</head>
<body>
<div class="app">

 <!-- ============ 顶部栏 ============ -->
 <header class="topbar">
 <div class="clock-area">
 <div class="ring-wrap" title="整体完成率">
 <svg width="52" height="52" viewBox="0 0 52 52">
 <circle class="ring-bg" cx="26" cy="26" r="22" fill="none" stroke-width="4"/>
 <circle class="ring-fg" id="progressRing" cx="26" cy="26" r="22" fill="none"
 stroke-width="4" stroke-linecap="round"
 stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
 </svg>
 <span class="ring-text" id="ringText">0%</span>
 </div>
 <div>
 <div class="clock-time" id="clockTime">--:--:--</div>
 <div class="clock-date" id="clockDate">加载中…</div>
 </div>
 </div>
 <div class="stats">
 <div class="stat s-total"><span class="num" id="stTotal">0</span><span class="lab">任务总数</span></div>
 <div class="stat s-doing"><span class="num" id="stDoing">0</span><span class="lab">进行中</span></div>
 <div class="stat s-done"><span class="num" id="stDone">0</span><span class="lab">已完成</span></div>
 <div class="stat s-over"><span class="num" id="stOver">0</span><span class="lab">已逾期</span></div>

const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => fmtDate(new Date());
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysUntil(s) { return Math.round((parseDate(s) - parseDate(todayStr())) / 86400000); }

function weekRange(base = new Date()) {
 const d = new Date(base);
 const offset = (d.getDay() + 6) % 7;
 const start = new Date(d); start.setDate(d.getDate() - offset); start.setHours(0,0,0,0);
 const end = new Date(start); end.setDate(start.getDate() + 6);
 return [start, end];
}

/* =========================================================
 数据层
========================================================= */
const STORE_KEY = 'workbench.tasks.v1';
const THEME_KEY = 'workbench.theme';
let tasks = [];
let filter = { cat: 'all', date: null, search: '', month: getCurrentMonth() };
let calCursor = new Date();
let editing = null;
let lastWeekKey = null;
let lastReport = '';

function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }

function getCurrentMonth() {
 const now = new Date();
 return now.getFullYear() + '-' + pad(now.getMonth() + 1);
}
function loadData() {
 try {
 tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
 // 如果是旧数据（只有4个任务），清除并重新生成
 if (tasks.length === 4 && tasks[0] && tasks[0].title.includes('Q4')) {
 localStorage.removeItem(STORE_KEY);
 tasks = [];
 }
 } catch (e) { tasks = []; }
 if (!tasks.length) { tasks = seedData(); saveData(); }
}

/* =========================================================
 主题
========================================================= */
function initTheme() {
 const saved = localStorage.getItem(THEME_KEY);
 if (saved === 'dark') {
 document.documentElement.setAttribute('data-theme', 'dark');
 $('#themeToggle').textContent = '☀️';

function toggleTheme() {

/* =========================================================
 时钟 + 激励语
========================================================= */
function tick() {
 const n = new Date();
 const wk = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][n.getDay()];

}

/* =========================================================
 顶部统计 + 环形进度
========================================================= */
function renderStats() {
 const t = todayStr();
 
 // 按日期或月份筛选
 const displayTasks = filter.date 
 ? tasks.filter(x => x.due === filter.date)
 : tasks.filter(x => x.due && x.due.startsWith(filter.month));
 
 const total = displayTasks.length;
 const doing = displayTasks.filter(x => x.status === 'doing').length;
 const done = displayTasks.filter(x => x.status === 'done').length;
 const overdue = displayTasks.filter(x => x.status !== 'done' && x.due && x.due < t).length;
 const soon = displayTasks.filter(x => x.status !== 'done' && x.due && x.due >= t && daysUntil(x.due) <= 3).length;

 document.getElementById('stTotal').textContent = total;
 document.getElementById('stDoing').textContent = doing;
 document.getElementById('stDone').textContent = done;
 document.getElementById('stOver').textContent = overdue;
 document.getElementById('stSoon').textContent = soon;

 // 左侧分类栏数字也按月份筛选
 document.getElementById('bgAll').textContent = total;
 document.getElementById('bgMonthly').textContent = displayTasks.filter(x => x.cat === 'monthly').length;
 document.getElementById('bgUrgent').textContent = displayTasks.filter(x => x.cat === 'urgent').length;
 document.getElementById('bgDaily').textContent = displayTasks.filter(x => x.cat === 'daily').length;

 // 环形进度
 const rate = total ? Math.round(done / total * 100) : 0;
 const circumference = 2 * Math.PI * 22;
 const offset = circumference * (1 - rate / 100);
 document.getElementById('progressRing').style.strokeDashoffset = offset;
 document.getElementById('ringText').textContent = rate + '%';
}

/* =========================================================
 今日待办
========================================================= */
function renderToday() {
 const t = todayStr();
 const displayDate = filter.date || t;
 const isToday = displayDate === t;
 
 const list = tasks
 .filter(x => x.status !== 'done' && x.due === displayDate)
 .sort((a, b) => {
 const prioOrder = { high: 0, normal: 1, low: 2 };
 return (prioOrder[a.priority] || 1) - (prioOrder[b.priority] || 1);
 });

 const dateLabel = isToday ? '今日' : displayDate;
 $('#todayPill').textContent = list.length + ' 项';

 const todayCard = $('#todayList').closest('.card');
 if (todayCard) {
 const title = todayCard.querySelector('.card-head h3');
 if (title) title.textContent = isToday ? '📌 今日待办' : '📌 ' + displayDate + ' 待办';
 }

 if (!list.length) {
 $('#todayList').innerHTML = '<div class="empty">🎉 ' + dateLabel + '暂无到期任务<br>享受一个清爽的工作日吧</div>';
 return;
 }

 $('#todayList').innerHTML = list.map(x => {
 const over = displayDate < t;
 const meta = over ? '⚠️ 逾期 ' + Math.abs(daysUntil(x.due)) + ' 天' : (isToday ? '📅 今天截止' : '📅 ' + x.due.slice(5));
 const prioCls = x.priority || 'normal';
 return '<div class="today-item ' + (over ? 'overdue' : '') + '" data-id="' + x.id + '">' +
 '<button class="inline-toggle ' + x.status + '" data-id="' + x.id + '" data-action="toggle"' +
 ' title="点击切换状态" aria-label="切换状态"></button>' +
 '<div class="tt">' +
 '<b>' + esc(x.title) + '</b>' +
 '<div class="tm">' +
 '<span>' + meta + '</span>' +
 '<span class="prio ' + prioCls + '">' + PRIO_LABEL[prioCls] + '</span>' +
 (x.contact ? '<span>👤 ' + esc(x.contact) + '</span>' : '') +
 '</div>' +
 '</div>' +
 '</div>';
 }).join('');
}

/* =========================================================
 周度复盘
========================================================= */
function renderWeek() {
 const [s, e] = weekRange();
 const key = 'review.' + fmtDate(s);
 $('#weekRange').textContent = `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`;
 if (key !== lastWeekKey) {
 // 自动汇总本周日清
 const weekRiqing = collectWeekRiqing(s, e);
 const saved = localStorage.getItem(key) || '';
 $('#reviewInput').value = saved || weekRiqing;
 lastWeekKey = key;
 }
}

function collectWeekRiqing(start, end) {
 const dailyContents = [];
 const d = new Date(start);
 while (d <= end) {
 const ds = fmtDate(d);
 const content = localStorage.getItem('riqing_' + ds);
 if (content) {
 dailyContents.push({ date: ds, content: content });
 }
 d.setDate(d.getDate() + 1);
 }
 
 if (!dailyContents.length) {
 return '本周暂无日清记录';
 }
 
 const workItems = [];
 dailyContents.forEach(function(day) {
 const lines = day.content.split('\n');
 lines.forEach(function(line) {
 line = line.trim();
 if (!line) return;
 line = line.replace(/^\d+[\.、\)]\s*/, '').replace(/^\d+\s*/, '');
 const match = line.match(/^(.+?)[\s:：]*(\d+)[\s]*[条次个份项件篇张块台辆架艘座只头匹峰窝盘瓶罐箱袋桶盆捆串把撮滴粒颗枚支枝根张片块团堆簇群帮批组套副剂贴剂服剂付剂道道路程场次回趟遍遭阵起桩宗桩项件起发枚支枝根张片块团堆簇群帮批组套副]/);
 if (match) {
 workItems.push({ task: match[1].trim(), count: parseInt(match[2]), raw: line });
 } else {
 workItems.push({ task: line, count: null, raw: line });
 }
 });
 });
 
 const taskSummary = {};
 workItems.forEach(function(item) {
 let taskName = item.task.replace(/[\s:：]*$/, '');
 let matchedKey = null;
 Object.keys(taskSummary).forEach(function(key) {
 // 完全包含关系
 if (key.includes(taskName) || taskName.includes(key)) {
 matchedKey = key;
 return;
 }
 // 提取共同核心词（2个字符以上）
 
 // 相似度计算
 const common = findCommonCore(key, taskName);
 if (common && common.length >= 2) {
 matchedKey = key;
 return;
 }
 if (similarity(key, taskName) > 0.35) {
 matchedKey = key;
 }
 });
 if (matchedKey) {
 taskSummary[matchedKey].days++;
 taskSummary[matchedKey].records.push(item.raw);
 if (item.count !== null) {
 taskSummary[matchedKey].total += item.count;
 taskSummary[matchedKey].hasCount = true;
 }
 } else {
 taskSummary[taskName] = { total: 0, days: 0, hasCount: false, records: [] };
 taskSummary[taskName].days++;
 taskSummary[taskName].records.push(item.raw);
 if (item.count !== null) {
 taskSummary[taskName].total += item.count;
 taskSummary[taskName].hasCount = true;
 }
 }
 });
 
 const summary = [];
 summary.push('【本周日清汇总】共 ' + dailyContents.length + ' 天记录');
 summary.push('');
 
 const sortedTasks = Object.keys(taskSummary).sort(function(a, b) {
 return taskSummary[b].total - taskSummary[a].total;
 });
 
 if (sortedTasks.length) {
 summary.push('▎本周工作事项：');
 sortedTasks.forEach(function(task) {
 const info = taskSummary[task];
 if (info.hasCount && info.total > 0) {
 summary.push('  · ' + task + '：共 ' + info.total + ' 条（' + info.days + '天）');
 } else {
 if (info.days > 1) {
 summary.push('  · ' + task + '（' + info.days + '次）');
 } else {
 summary.push('  · ' + info.records[0]);
 }
 }
 });
 }
 
 return summary.join('\n');
}

function similarity(s1, s2) {
 if (!s1 || !s2) return 0;
 const longer = s1.length > s2.length ? s1 : s2;
 const shorter = s1.length > s2.length ? s2 : s1;
 if (longer.length === 0) return 1.0;
 const longerArr = longer.split('');
 const shorterArr = shorter.split('');
 let matches = 0;
 shorterArr.forEach(function(c) {
 const idx = longerArr.indexOf(c);
 if (idx !== -1) {
 matches++;
 longerArr.splice(idx, 1);
 }
 });
 return matches / longer.length;
}

function findCommonCore(s1, s2) {
 // 找出两个字符串的共同核心词（连续2个以上字符）
 let common = '';
 for (let i = 0; i < s1.length - 1; i++) {
 for (let j = i + 2; j <= s1.length; j++) {
 const sub = s1.substring(i, j);
 if (s2.includes(sub) && sub.length > common.length) {
 common = sub;
 }
 }
 }
 return common;
}

 lines.forEach(function(line) {

 if (match) {
 workItems.push({ task: match[1].trim(), count: parseInt(match[2]), raw: line });
 } else {
 workItems.push({ task: line, count: null, raw: line });
 }
 });
 });
 
 const taskSummary = {};
 workItems.forEach(function(item) {
 let taskName = item.task.replace(/[\s:：]*$/, '');
 let matchedKey = null;
 Object.keys(taskSummary).forEach(function(key) {
 if (key.includes(taskName) || taskName.includes(key)) {
 matchedKey = key;
 return;
 }

 const common = findCommonCore(key, taskName);
 if (common && common.length >= 2) {
 matchedKey = key;
 return;
 }
 if (similarity(key, taskName) > 0.35) {
 matchedKey = key;
 }
 });
 if (matchedKey) {
 taskSummary[matchedKey].days++;
 taskSummary[matchedKey].records.push(item.raw);
 if (item.count !== null) {
 taskSummary[matchedKey].total += item.count;
 taskSummary[matchedKey].hasCount = true;
 }
 } else {
 taskSummary[taskName] = { total: 0, days: 0, hasCount: false, records: [] };
 taskSummary[taskName].days++;
 taskSummary[taskName].records.push(item.raw);
 if (item.count !== null) {
 taskSummary[taskName].total += item.count;
 taskSummary[taskName].hasCount = true;
 }
 }
 });
 
 const summary = [];
 summary.push('【本月日清汇总】共 ' + dailyContents.length + ' 天记录，覆盖率 ' + Math.round(dailyContents.length / daysInMonth * 100) + '%');
 summary.push('');
 
 const sortedTasks = Object.keys(taskSummary).sort(function(a, b) {
 return taskSummary[b].total - taskSummary[a].total;
 });
 
 if (sortedTasks.length) {
 summary.push('▎本月主要工作：');
 sortedTasks.forEach(function(task) {
 const info = taskSummary[task];
 if (info.hasCount && info.total > 0) {
 summary.push('  · ' + task + '：共 ' + info.total + ' 条（' + info.days + '天）');
 } else {
 if (info.days > 1) {
 summary.push('  · ' + task + '（' + info.days + '次）');
 } else {
 summary.push('  · ' + info.records[0]);
 }
 }
 });
 }
 
 return summary.join('\n');
}

function sortTasks(list) {
 const order = { doing: 0, todo: 1, done: 2 };
 const prioOrder = { high: 0, normal: 1, low: 2 };
 return list.sort((a, b) => {
 if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
 if (prioOrder[a.priority] !== prioOrder[b.priority])
 return (prioOrder[a.priority] || 1) - (prioOrder[b.priority] || 1);
 return (a.due || '9999-99-99').localeCompare(b.due || '9999-99-99');
 });
}

/* =========================================================

function renderCalendar() {
 const y = calCursor.getFullYear(), m = calCursor.getMonth();
 $('#calTitle').textContent = `${y}年${m + 1}月`;

 const first = new Date(y, m, 1);
 const startIdx = (first.getDay() + 6) % 7;
 const days = new Date(y, m + 1, 0).getDate();
 const prevDays = new Date(y, m, 0).getDate();

 const byDate = {};
 tasks.forEach(t => { if (t.due) (byDate[t.due] = byDate[t.due] || []).push(t); });

 let html = '<div class="cal-head">' + ['一','二','三','四','五','六','日'].map(d => `<span>${d}</span>`).join('') + '</div>';
 html += '<div class="cal-grid">';

 for (let i = startIdx - 1; i >= 0; i--) {
 html += `<div class="cal-cell out"><span class="cal-num">${prevDays - i}</span></div>`;
 }

 for (let d = 1; d <= days; d++) {
 const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
 const items = byDate[ds] || [];
 const cls = [
 'cal-cell',
 ds === todayStr() ? 'today' : '',
 ds === filter.date ? 'sel' : '',
 ((startIdx + d - 1) % 7) >= 5 ? 'wk' : ''
 ].filter(Boolean).join(' ');

 const title = items.length ? items.map(x => x.title).join('\n') : '';

 html += `<div class="${cls}" data-date="${ds}" title="${esc(title)}">
 <span class="cal-num">${d}</span>
 <div class="cal-dots">
 ${items.slice(0, 3).map(t => `<i class="${t.cat}"></i>`).join('')}
 ${items.length > 3 ? '<em>+</em>' : ''}
 </div>
 </div>`;
 }

 const rest = (7 - ((startIdx + days) % 7)) % 7;
 for (let i = 1; i <= rest; i++) {
 html += `<div class="cal-cell out"><span class="cal-num">${i}</span></div>`;
 }

 html += '</div>';
 $('#calendar').innerHTML = html;
}

/* =========================================================
 报告生成
========================================================= */
function buildReport(type) {
 const now = new Date();
 let s, e, title;

 if (type === 'week') {
 [s, e] = weekRange(now);
 title = '工作周报';
 } else {
 s = new Date(now.getFullYear(), now.getMonth(), 1);
 e = new Date(now.getFullYear(), now.getMonth() + 1, 0);
 title = '工作月报';
 }

 const sS = fmtDate(s), eS = fmtDate(e);
 const inRange = d => d && d >= sS && d <= eS;
 const t = todayStr();

 // 获取当期任务（有截止时间且在范围内的任务）
 const periodTasks = tasks.filter(x => x.due && inRange(x.due));

 const done = periodTasks.filter(x => x.status === 'done');
 const doing = periodTasks.filter(x => x.status === 'doing');
 const overdue = periodTasks.filter(x => x.status !== 'done' && x.due && x.due < t);
 const soon = periodTasks.filter(x => x.status !== 'done' && x.due && x.due >= t && daysUntil(x.due) <= 3);

 const L = [];
 L.push(`📊 ${title} ${sS} ~ ${eS}`);
 L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━');
 L.push('');

 L.push(`一、本期完成（${done.length} 项）`);
 if (done.length) {
 done.forEach((x, i) => {
 L.push(` ${i + 1}. ${x.title}` +
 (x.contact ? ` ｜ 对接人：${x.contact}` : '') +
 (x.doneAt ? ` ｜ 完成于 ${x.doneAt.slice(5)}` : ''));
 });
 } else L.push(' （暂无）');
 L.push('');

 L.push(`二、进行中（${doing.length} 项）`);
 if (doing.length) {
 doing.forEach((x, i) => {
 L.push(` ${i + 1}. ${x.title}` +
 (x.due ? ` ｜ 截止 ${x.due}` : '') +
 (x.contact ? ` ｜ 对接人：${x.contact}` : ''));
 });
 } else L.push(' （暂无）');
 L.push('');

 L.push(`三、风险提醒（逾期 ${overdue.length} 项 / 即将到期 ${soon.length} 项）`);
 if (overdue.length) {
 overdue.forEach((x, i) => L.push(` ⚠ ${i + 1}. ${x.title} ｜ 已逾期 ${Math.abs(daysUntil(x.due))} 天`));
 }
 if (soon.length) {
 soon.forEach((x, i) => L.push(`  ${i + 1}. ${x.title} ｜ ${daysUntil(x.due) === 0 ? '今天' : daysUntil(x.due) + ' 天后'}截止`));
 }
 if (!overdue.length && !soon.length) L.push(' （暂无风险项）');
 L.push('');

 const total = periodTasks.length;
 const periodDone = periodTasks.filter(x => x.status === 'done').length;
 const rate = total ? Math.round(periodDone / total * 100) : 0;
 L.push('四、数据概览');
 L.push(` 任务总数 ${total} ｜ 进行中 ${doing.length} ｜ 已完成 ${periodDone} ｜ 整体完成率 ${rate}%`);
 L.push('');

 if (type === 'week') {
 L.push('五、本周复盘');
 const txt = ($('#reviewInput').value || '').trim();
 L.push(txt ? txt.split('\n').map(l => ' ' + l).join('\n') : ' （未填写）');
 L.push('');
 L.push('六、下周计划');
 L.push(' 1. ');
 L.push(' 2. ');
 L.push(' 3. ');
 } else {
 const monthRiqing = collectMonthRiqing(now.getFullYear(), now.getMonth());
 L.push('五、本月日清汇总');
 L.push(monthRiqing);
 L.push('');
 L.push('六、下月重点');
 L.push(' 1. ');
 L.push(' 2. ');
 L.push(' 3. ');
 }

 return L.join('\n');
}

function handleImport(e) {

 const reader = new FileReader();
 reader.onload = function(ev) {
 try {
 const imported = JSON.parse(ev.target.result);
 if (!Array.isArray(imported)) throw new Error('格式错误');
 const count = imported.length;
 if (confirm(`导入 ${count} 条任务？（将与现有任务合并）`)) {
 // 去重：按 id 合并，新的覆盖旧的
 const map = new Map(tasks.map(t => [t.id, t]));
 imported.forEach(t => { if (t.id && t.title) map.set(t.id, t); });
 tasks = [...map.values()];
 saveData();
 renderAll();
 showToast(`📥 成功导入 ${count} 条任务`);
 }
 } catch (err) {
 showToast('❌ 导入失败：文件格式不正确');
 }
 };
 reader.readAsText(file);
 e.target.value = '';
}

 // 快捷键面板
 $('#btnShortcuts').addEventListener('click', () => {
 $('#shortcutPanel').classList.toggle('show');
 });

 // 搜索
 $('#searchInput').addEventListener('input', e => {
 filter.search = e.target.value.trim();
 $('#clearSearch').classList.toggle('show', !!filter.search);
 renderTaskList();
 });
 $('#clearSearch').addEventListener('click', () => {
 filter.search = '';
 $('#searchInput').value = '';

 renderTaskList();

 // 任务点击（委托）
 document.addEventListener('click', e => {
 // 行内切换按钮
 const toggleBtn = e.target.closest('[data-action="toggle"]');
 if (toggleBtn) {
 inlineToggle(toggleBtn.dataset.id, e);
 return;
 }
 // 打开详情
 const item = e.target.closest('.today-item, .task-item');
 if (item && item.dataset.id) openTask(item.dataset.id);
 });

 // 日历点击（委托）
 $('#calendar').addEventListener('click', e => {
 const cell = e.target.closest('.cal-cell');
 if (!cell || cell.classList.contains('out') || !cell.dataset.date) return;
 const clickedDate = cell.dataset.date;
 filter.date = (filter.date === clickedDate) ? null : clickedDate;
 if (filter.date) {
 filter.month = clickedDate.slice(0, 7);
 }
 filter.cat = 'all';
 $$('.nav-item[data-cat]').forEach(x => x.classList.toggle('active', x.dataset.cat === 'all'));
 renderAll();
 });

 // 日历翻月
 $('#calPrev').addEventListener('click', () => {
 calCursor.setMonth(calCursor.getMonth() - 1);
 filter.month = calCursor.getFullYear() + '-' + pad(calCursor.getMonth() + 1);
 filter.date = null; // 清除具体日期筛选
 renderAll();
 });
 $('#calNext').addEventListener('click', () => {
 calCursor.setMonth(calCursor.getMonth() + 1);
 filter.month = calCursor.getFullYear() + '-' + pad(calCursor.getMonth() + 1);
 filter.date = null; // 清除具体日期筛选
 renderAll();
 });
 $('#calToday').addEventListener('click', () => {
 calCursor = new Date();
 filter.month = getCurrentMonth(); // 重置为当前月
 filter.date = null; // 清除具体日期筛选
 renderAll();
 });

 // 复盘

 // 报告弹窗
 $('#btnCloseReport').addEventListener('click', () => $('#reportMask').classList.remove('show'));

 $('#btnCopyReport').addEventListener('click', async () => {
 try {

 $('#btnDownloadReport').addEventListener('click', () => {

 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = `${$('#reportTitle').textContent}_${todayStr()}.txt`;

 URL.revokeObjectURL(a.href);

 });

 // 全局键盘快捷键
 document.addEventListener('keydown', e => {
 // 弹窗打开时只处理 Esc 和 Ctrl+S
 if ($('#mask').classList.contains('show')) {
 if (e.key === 'Escape') closeModal();
 if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveTask(); }
 return;
 }
 if ($('#reportMask').classList.contains('show')) {
 if (e.key === 'Escape') $('#reportMask').classList.remove('show');
 return;
 }

 // 不在 input/textarea 中时
 const tag = (e.target.tagName || '').toLowerCase();
 const isInput = tag === 'input' || tag === 'textarea' || tag === 'select';

 if (e.key === 'Escape') {
 $('#shortcutPanel').classList.remove('show');
 return;
 }

 if (isInput) return;

 if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNew(); }
 if (e.key === '/') { e.preventDefault(); $('#searchInput').focus(); }
 if (e.key === '?') { $('#shortcutPanel').classList.toggle('show'); }
 if (e.key === 'd' || e.key === 'D') { toggleTheme(); }
 });

 // 点击其他地方关闭快捷键面板
 document.addEventListener('click', e => {
 const panel = $('#shortcutPanel');
 if (panel.classList.contains('show') && !panel.contains(e.target) && e.target.id !== 'btnShortcuts') {
 panel.classList.remove('show');
 }
 });

 // 日清编辑按钮
 document.getElementById('btnEditRiqing').addEventListener('click', editRiqing);
 document.getElementById('btnSaveRiqing').addEventListener('click', saveRiqing);
}

 启动
========================================================= */

/* =========================================================
 每日日清功能
========================================================= */
function loadRiqing() {
 const today = todayStr();
 const displayDate = filter.date || today;
 
 // 从localStorage加载日清数据
 const stored = localStorage.getItem('riqing_' + displayDate);
 const display = document.getElementById('riqingDisplay');
 const datePicker = document.getElementById('riqingDatePicker');
 
 // 隐藏日期选择器
 datePicker.style.display = 'none';
 
 if (stored) {
 display.innerHTML = '<pre>' + esc(stored) + '</pre>';
 } else {
 display.innerHTML = '<div class="empty">📭 ' + displayDate + ' 暂无日清<br>点击右上角「编辑」添加</div>';
 }
 
 // 重置编辑状态
 document.getElementById('btnEditRiqing').style.display = '';
 document.getElementById('btnSaveRiqing').style.display = 'none';
 document.getElementById('riqingEdit').style.display = 'none';
 display.style.display = '';
}

function editRiqing() {
 const display = document.getElementById('riqingDisplay');
 const edit = document.getElementById('riqingEdit');
 const datePicker = document.getElementById('riqingDatePicker');
 const currentContent = display.querySelector('pre') ? display.querySelector('pre').textContent : '';
 
 // 设置日期选择器的值为当前显示的日期
 const today = todayStr();
 const displayDate = filter.date || today;
 datePicker.value = displayDate;
 
 edit.value = currentContent;
 display.style.display = 'none';
 edit.style.display = '';
 datePicker.style.display = '';
 document.getElementById('btnEditRiqing').style.display = 'none';
 document.getElementById('btnSaveRiqing').style.display = '';
 edit.focus();
}

function saveRiqing() {
 const datePicker = document.getElementById('riqingDatePicker');
 const saveDate = datePicker.value || todayStr();
 const content = document.getElementById('riqingEdit').value.trim();
 
 if (content) {
 localStorage.setItem('riqing_' + saveDate, content);
 } else {
 localStorage.removeItem('riqing_' + saveDate);
 }
 
 loadRiqing();
 showToast('💾 日清已保存 (' + saveDate + ')');
}
